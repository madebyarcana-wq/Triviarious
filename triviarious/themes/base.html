<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
${LAYOUT_CSS}

/* ==== テーマCSS ==== */
${THEME_CSS}

/* ==== 色オーバーライド(カラーピッカーで指定された分だけ上書き) ==== */
${OVERRIDE_STYLE}
</style>
</head>
<body class="theme-${THEME} role-${ROLE}">
  <div class="stage">
    ${BG_LAYER}
    <header class="top">
      <div class="kicker">${KICKER}</div>
      <div class="index">${INDEX}</div>
    </header>
    <main class="center">
      <div class="telop anim" style="--d:0s">${TELOP}</div>
      ${SUBTELOP}
    </main>
    <footer class="bottom">
      <div class="steps">${STEPS}</div>
      <div class="swipe">${SWIPE}</div>
    </footer>
  </div>
<script>
// テロップの各行が枠に収まらないときは、改行させずに文字を小さくして収める。
(function () {
  for (const el of document.querySelectorAll(".telop, .subtelop")) {
    const max = parseFloat(getComputedStyle(el).maxWidth) || 940;
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > max + 1 && size > 32) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  }
})();
// ?t=<秒> でアニメーションをその時刻の状態で停止させる(未指定は完了状態)。
// 各要素は --d でベースの animation-delay を持てる(スタガー用)。
(function () {
  const q = new URLSearchParams(location.search);
  const t = parseFloat(q.get("t") || "999");
  for (const el of document.querySelectorAll("*")) {
    const cs = getComputedStyle(el);
    if (cs.animationName && cs.animationName !== "none") {
      const base = parseFloat(cs.getPropertyValue("--d")) || 0;
      el.style.animationDelay = (base - t) + "s";
      el.style.animationPlayState = "paused";
    }
  }
})();
</script>
</body>
</html>
